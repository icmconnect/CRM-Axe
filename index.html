<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Ase Connect - Gestão Profissional para Casas de Axé</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/assets/images/favicon.png" />
    <link rel="shortcut icon" href="/assets/images/favicon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1A1A1A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ase Connect" />
    <link rel="apple-touch-icon" href="/assets/images/favicon.png" />
  </head>
  <body class="min-h-screen bg-slate-50 dark:bg-[#1A1A1A] text-slate-800 dark:text-slate-100 antialiased">
    <div id="root" class="min-h-screen w-full flex flex-col bg-slate-50 dark:bg-[#1A1A1A]"></div>
    <script>
      // Unregister service workers if they are causing issues with 404 caching
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (let registration of registrations) {
            registration.unregister();
          }
        });
      }

      // Keep-alive heartbeat to prevent container sleep
      setInterval(() => {
        fetch('/api/heartbeat')
          .then(r => r.json())
          .then(d => console.log('Heartbeat:', d.status))
          .catch(e => console.warn('Heartbeat check silent fallback'));
      }, 60 * 1000); // Every 1 minute
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
